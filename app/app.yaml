# Databricks Apps runtime config. Apps runs `npm install` and `npm run build`, then this command.
command: ["npm", "run", "start"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_AI_MODEL
    valueFrom: ai-model
  - name: DATABRICKS_CATALOG
    value: the_curve
  - name: REFRESH_JOB_ID          # started after each resolution so gold catches up (app/src/server/jobs.ts)
    valueFrom: refresh-job
  - name: ADMIN_EMAILS            # admins create + resolve markets (secret the-curve/admin_emails; never in the repo)
    valueFrom: admin-emails
  - name: LAKEBASE_ENDPOINT
    value: projects/the-curve-ledger/branches/production/endpoints/primary
  # Demo mode: sign-in links are shown on screen (no email). Acceptable ONLY because Databricks Apps already
  # restricts this app to workspace members. Remove before any public deployment (see CLAUDE.md, Accounts and login).
  - name: DEMO_LOGIN
    value: "1"
