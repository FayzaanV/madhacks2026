# Databricks Asset Bundle for The Curve.
#   databricks bundle validate
#   databricks bundle deploy -t dev     # your own copy of jobs/pipelines (prefixed with your name)
#   databricks bundle deploy -t prod    # the shared copy the demo runs on; deploy from main only
bundle:
  name: the_curve

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all tables
    default: the_curve
  warehouse_id:
    description: SQL warehouse the app and SQL tasks use (Serverless Starter Warehouse)
    default: d3933f49c3b5beb3
  ai_model:
    description: Foundation Model endpoint used by the AI market analyst
    default: databricks-meta-llama-3-3-70b-instruct
  lakebase_instance:
    description: Lakebase (managed Postgres) instance name
    default: the-curve-ledger

workspace:
  host: https://dbc-9eafb64f-74c3.cloud.databricks.com

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
