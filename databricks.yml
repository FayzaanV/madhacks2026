# Databricks Asset Bundle for Yomi.
#   databricks bundle validate
#   databricks bundle deploy            # = -t prod: the shared team deployment (deploy from an up-to-date main)
#   databricks bundle run yomi          # rebuild + restart the website after app code changes
bundle:
  name: the_curve

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all tables
    default: the_curve
  warehouse_id:
    description: SQL warehouse the app and SQL tasks use (Serverless Starter Warehouse)
    default: cba268733f96d335
  ai_model:
    description: Foundation Model endpoint used by the AI market analyst
    default: databricks-meta-llama-3-3-70b-instruct
  lakebase_instance:
    description: Lakebase (managed Postgres) instance name
    default: the-curve-ledger

# Moved 2026-11-15 to Rishon's Free Edition workspace after the original one (dbc-9eafb64f-74c3, Musa's) ran out
# of compute quota. Everyone: `databricks auth login --host <this URL>` and deploy from an up-to-date main.
workspace:
  host: https://dbc-a76cc260-1137.cloud.databricks.com

targets:
  # dev = a personal sandbox (names prefixed with your user). It CANNOT include the yomi app or the shared
  # pipeline tables while prod exists (same names), so use it only for experiments on jobs/notebooks.
  dev:
    mode: development
  # prod = the ONE shared team deployment. Everyone deploys here from main: `databricks bundle deploy`.
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: users
        level: CAN_MANAGE
