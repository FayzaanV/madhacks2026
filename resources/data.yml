resources:
  pipelines:
    medallion:
      name: yomi-medallion
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      photon: true
      channel: CURRENT
      libraries:
        - file:
            path: ../databricks/pipelines/silver.sql
        - file:
            path: ../databricks/pipelines/gold.sql

    # Union markets get their own pipeline so they can never break the leaderboard/profile refresh above.
    union:
      name: yomi-union-pipeline
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      photon: true
      channel: CURRENT
      libraries:
        - file:
            path: ../databricks/pipelines/union.sql
        - file:
            path: ../databricks/pipelines/campus.sql   # rec-center crowding (facility_busyness)

  jobs:
    simulate_and_build:
      name: yomi-simulate-and-build
      description: Regenerate simulated bronze data, then refresh silver/gold.
      tasks:
        - task_key: simulate
          notebook_task:
            notebook_path: ../databricks/notebooks/01_simulate_data.py
            base_parameters:
              catalog: ${var.catalog}
              seed: "42"
        - task_key: seed_lakebase
          depends_on:
            - task_key: simulate
          notebook_task:
            notebook_path: ../databricks/notebooks/02_seed_lakebase.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: medallion
          depends_on:
            - task_key: simulate
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion.id}
            full_refresh: true

    refresh:
      name: yomi-refresh
      # The app starts this job after each resolution; keep its service principal's run permission on redeploys.
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${resources.apps.yomi.service_principal_client_id}
      description: Lakebase ledger -> bronze, refresh silver/gold (leaderboards), AI analyst insights; then the Union steps, which can fail without affecting anything before them.
      # Compute budget (Free Edition): one run at a time, extra triggers are DROPPED (not queued), every 30 min.
      # PAUSED after the quota ran out on 2026-11-14; set UNPAUSED here (and deploy) once compute is back.
      queue:
        enabled: false
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      tasks:
        - task_key: sync_bronze
          notebook_task:
            notebook_path: ../databricks/notebooks/10_sync_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              ledger_catalog: the_curve_ledger
        - task_key: medallion
          depends_on:
            - task_key: sync_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion.id}
        - task_key: ai_analyst
          depends_on:
            - task_key: medallion
          notebook_task:
            notebook_path: ../databricks/notebooks/30_ai_analyst_batch.py
            base_parameters:
              catalog: ${var.catalog}
              ai_model: ${var.ai_model}
        # Campus weather: Open-Meteo values for weather markets whose day has ended (the app settles from them).
        - task_key: campus_weather
          depends_on:
            - task_key: medallion
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../databricks/notebooks/20_campus_weather.py

    # Union venue feed + settlement + pipeline: its own job so it never adds to the core refresh. Hourly, PAUSED
    # until the team decides to spend compute on it.
    union_live:
      name: yomi-union-live
      description: Union venue feed (sensor or simulated), settle due Union markets, refresh the Union pipeline.
      queue:
        enabled: false
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 5 * * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      tasks:
        - task_key: union_feed
          notebook_task:
            notebook_path: ../databricks/notebooks/40_union_feed.py
        - task_key: union_settle
          depends_on:
            - task_key: union_feed
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../databricks/notebooks/42_union_settle.py
        - task_key: union_pipeline
          depends_on:
            - task_key: union_settle
          run_if: ALL_DONE
          pipeline_task:
            pipeline_id: ${resources.pipelines.union.id}

    union_markets:
      name: yomi-union-markets
      description: Open today's Union markets (thresholds from each venue's history) at 6am Madison time.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      tasks:
        - task_key: open_markets
          notebook_task:
            notebook_path: ../databricks/notebooks/41_union_markets.py
