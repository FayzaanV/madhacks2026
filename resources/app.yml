resources:
  apps:
    yomi:
      name: yomi
      description: "Yomi: bet your Clout, not your cash. Campus prediction market."
      source_code_path: ../app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: ai-model
          serving_endpoint:
            name: ${var.ai_model}
            permission: CAN_QUERY
        - name: ledger
          postgres:
            branch: projects/the-curve-ledger/branches/production
            database: projects/the-curve-ledger/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: refresh-job
          job:
            id: ${resources.jobs.refresh.id}
            permission: CAN_MANAGE_RUN
        # Comma-separated Yomi sign-in emails allowed to create and resolve markets. Lives in a secret because
        # this repo is public: `databricks secrets put-secret the-curve admin_emails`.
        - name: admin-emails
          secret:
            scope: the-curve
            key: admin_emails
            permission: READ
      # Team access comes from the prod target's top-level permissions (users: CAN_MANAGE) in databricks.yml.
